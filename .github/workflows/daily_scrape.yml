name: Daily EGP Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          EGP_PORTAL_EMAIL: ${{ secrets.EGP_PORTAL_EMAIL }}
          EGP_PORTAL_PASSWORD: ${{ secrets.EGP_PORTAL_PASSWORD }}
        run: python egp_scraper.py

      - name: Upload CSV to GCS
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS }}
          GCP_BUCKET_NAME: ${{ secrets.GCP_BUCKET_NAME }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > gcp-key.json
          python upload_to_gcs.py
